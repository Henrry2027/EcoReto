<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Acción - Misión Eco-Reto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="sidebar">
        <h2>Misión Eco-Reto</h2>
        <a href="{{ url_for('lista_acciones') }}">🌱 Mis acciones</a>
        <a href="{{ url_for('nueva_accion') }}">➕ Nueva acción</a>
        <a href="{{ url_for('login') }}">🚪 Cerrar sesión</a>
    </div>

    <div class="main-content">
        <h1>Editar acción</h1>
        <form action="{{ url_for('editar_accion', id=accion.id) }}" method="POST" style="max-width: 500px; background: white; padding: 20px; border-radius: 8px;">
            <div class="form-group">
                <label>Tipo de acción</label>
                <input type="text" name="tipo" value="{{ accion.tipo }}" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="3" required>{{ accion.descripcion }}</textarea>
            </div>
            <div class="form-group">
                <label>Fecha</label>
                <input type="text" name="fecha" value="{{ accion.fecha }}" required>
            </div>
            <div class="form-group">
                <label>Impacto</label>
                <input type="text" name="impacto" value="{{ accion.impacto }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{{ url_for('lista_acciones') }}" class="btn" style="background-color: #64748b;">Cancelar</a>
        </form>
    </div>
</body>
</html>
